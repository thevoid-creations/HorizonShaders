schema = 1
id = "horizon_aurora"
name = "Horizon Aurora"
version = "2.0.0"
api = "0.1"
description = "Screen-space reflections on water, contact shading, volumetric sun shafts, a soft bloom and a cinematic grade over natural blue skies, golden light and air with depth. Six full-screen passes; for weaker GPUs see Horizon Aurora Lite."
authors = ["thevoid-creations"]
license = "MIT"
shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"
name = "Sky"

[material]
file = "material.wgsl"
name = "Terrain"

[[post]]
file = "post/atmosphere.wgsl"
name = "Air"

[[post]]
file = "post/ao.wgsl"
name = "Contact shading"

[[post]]
file = "post/reflections.wgsl"
name = "Water reflections"

[[post]]
file = "post/godrays.wgsl"
name = "Sun shafts"

[[post]]
file = "post/bloom.wgsl"
name = "Bloom"

[[post]]
file = "post/grade.wgsl"
name = "Grade"

[budget]
gpu_ms = 4.0
