schema = 1
id = "horizon_aurora_lite"
name = "Horizon Aurora Lite"
version = "2.0.0"
api = "0.1"
description = "Horizon Aurora's skies, terrain, water and grade with the screen-space passes left out: no reflections, contact shading, sun shafts or bloom. Two full-screen passes, for integrated graphics and older GPUs."
authors = ["thevoid-creations"]
license = "MIT"
shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"
name = "Sky"

[material]
file = "material.wgsl"
name = "Terrain"

[[post]]
file = "post/atmosphere.wgsl"
name = "Air"

[[post]]
file = "post/grade.wgsl"
name = "Grade"

[budget]
gpu_ms = 0.9
